name: Sync Treasury Balances

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Hit backend sync endpoint
        run: |
          # Replace the URL below with your actual production backend URL once deployed.
          # We use -f to fail the step if the HTTP status is not 2xx.
          curl -f -X POST "https://cheeseball-backend.vercel.app/api/wallets/admin/treasury/sync" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
