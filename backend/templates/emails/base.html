<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>{% block title %}Cheeseball{% endblock %}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body,table,td,p,a,span{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}
  table,td{mso-table-lspace:0pt;mso-table-rspace:0pt;}
  img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;}
  body{margin:0;padding:0;background-color:#f4f5f7;font-family:'Inter',Helvetica,Arial,sans-serif;}
  a{color:#1a6fff;text-decoration:none;}
  @media only screen and (max-width:600px){
    .wrap{width:100%!important;}
    .pad{padding:32px 24px!important;}
    .btn{padding:14px 24px!important;font-size:14px!important;}
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;">

  <!-- Preheader -->
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">{% block preheader %}Account update from Cheeseball{% endblock %}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f5f7;">
    <tr>
      <td align="center" style="padding:48px 16px;">
        <table role="presentation" class="wrap" cellpadding="0" cellspacing="0" border="0" style="width:560px;max-width:560px;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <span style="font-family:'Inter',Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;color:#0a0f1e;letter-spacing:-0.3px;">
                Cheese<span style="color:#1a6fff;">ball</span>
              </span>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td class="pad" style="background:#ffffff;border-radius:16px;border:1px solid #e5e8f0;padding:40px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding:28px 24px 0;">
              <p style="margin:0;font-size:12px;color:#9aa3b5;line-height:1.7;text-align:center;">
                Need help? <a href="https://cheeseballapp.com/dashboard/support" style="color:#1a6fff;">Contact support</a><br>
                © 2026 Cheeseball · <a href="https://cheeseballapp.com" style="color:#9aa3b5;">cheeseballapp.com</a><br>
                This is an automated message — please do not reply.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
