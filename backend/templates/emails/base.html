<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{{ headline }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            color-scheme: light only;
            supported-color-schemes: light;
        }

        body {
            background: #e8f4ff;
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
            color: #3a5878;
            -webkit-font-smoothing: antialiased;
            color-scheme: light only;
        }

        .preheader {
            display: none;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
        }

        .shell {
            width: 100%;
            padding: 40px 16px;
            background:
                radial-gradient(circle at top left, rgba(130, 208, 255, 0.35) 0, rgba(130, 208, 255, 0) 34%),
                linear-gradient(180deg, #f8fcff 0%, #e8f4ff 100%);
        }

        .card {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #c2dff7;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 18px 50px rgba(56, 170, 255, 0.14);
        }

        .hero {
            background:
                radial-gradient(circle at top right, rgba(255, 255, 255, 0.28) 0, rgba(255, 255, 255, 0) 28%),
                linear-gradient(180deg, #58beff 0%, #38aaff 58%, #2f9df0 100%);
            padding: 32px 36px 28px;
            color: #ffffff;
        }

        .brand-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255, 255, 255, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            padding: 5px 12px 5px 8px;
            margin-bottom: 18px;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ffffff;
            flex-shrink: 0;
        }

        .brand-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #ffffff;
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: 28px;
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .hero p {
            margin: 0;
            font-size: 14px;
            line-height: 1.65;
            color: rgba(255, 255, 255, 0.88);
            max-width: 420px;
        }

        .body {
            padding: 32px 36px 24px;
        }

        .body p {
            font-size: 15px;
            line-height: 1.7;
            color: #3a5878;
            margin: 0 0 16px;
        }

        .intro-copy {
            margin-bottom: 18px;
        }

        .eyebrow {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #1a8fe3;
            background: #e4f3ff;
            border-radius: 6px;
            padding: 4px 10px;
            margin-bottom: 16px;
        }

        .otp-wrap {
            background: linear-gradient(180deg, #fafdff 0%, #eef8ff 100%);
            border: 1px solid #c8e6fb;
            border-radius: 18px;
            padding: 26px 22px 22px;
            text-align: center;
            margin: 10px 0 22px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .otp-head {
            margin-bottom: 18px;
        }

        .otp-title {
            margin-bottom: 6px;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.35;
            color: #2a79bb;
        }

        .otp-subtitle {
            font-size: 13px;
            line-height: 1.6;
            color: #6d9abb;
        }

        .otp-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #4aabee;
            margin-bottom: 12px;
        }

        .otp-code {
            display: inline-block;
            background: #ffffff;
            border: 2px solid #90cffa;
            border-radius: 16px;
            padding: 18px 26px 18px 34px;
            min-width: 290px;
            font-size: 52px;
            font-weight: 700;
            letter-spacing: 0.34em;
            color: #1a8fe3;
            line-height: 1;
            box-shadow: 0 14px 34px rgba(56, 170, 255, 0.16);
        }

        .otp-meta {
            margin-top: 14px;
            font-size: 13px;
            font-weight: 600;
            color: #7baed4;
        }

        .otp-steps {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #d9eefc;
        }

        .otp-steps p {
            margin: 0;
            font-size: 13px;
            line-height: 1.7;
            color: #6b96b7;
        }

        .notice {
            background: #f0f9ff;
            border-left: 3px solid #38aaff;
            border-radius: 0 10px 10px 0;
            padding: 14px 16px;
            margin: 0 36px 24px;
        }

        .notice p {
            margin: 0;
            font-size: 13px;
            line-height: 1.65;
            color: #5c86a8;
        }

        .footer {
            padding: 0 36px 30px;
        }

        .divider {
            height: 1px;
            background: #e0f0fb;
            margin-bottom: 20px;
        }

        .footer p {
            margin: 0;
            font-size: 13px;
            line-height: 1.7;
            color: #7aa4c2;
        }

        .footer strong {
            color: #38aaff;
            font-weight: 600;
        }

        @media (prefers-color-scheme: dark) {
            body,
            .shell,
            .card,
            .body,
            .otp-wrap,
            .notice,
            .footer,
            .divider {
                background-color: inherit !important;
            }

            body,
            .body p,
            .otp-title,
            .otp-subtitle,
            .otp-label,
            .otp-meta,
            .otp-steps p,
            .notice p,
            .footer p,
            .footer strong,
            .eyebrow,
            .otp-code {
                color: inherit !important;
            }

            .card,
            .otp-wrap,
            .otp-code,
            .notice,
            .divider {
                border-color: inherit !important;
            }
        }

        @media only screen and (max-width: 560px) {
            .shell { padding: 20px 10px; }
            .hero, .body, .footer { padding-left: 20px; padding-right: 20px; }
            .notice { margin-left: 20px; margin-right: 20px; }
            .hero h1 { font-size: 22px; }
            .otp-wrap { padding-left: 16px; padding-right: 16px; }
            .otp-title { font-size: 16px; }
            .otp-code {
                min-width: 0;
                width: 100%;
                padding: 16px 12px 16px 18px;
                font-size: 36px;
                letter-spacing: 0.24em;
            }
        }
    </style>
</head>
<body>
    <div class="preheader">{{ preheader }}</div>

    <div class="shell">
        <div class="card">

            <div class="hero">
                <div class="brand-pill">
                    <div class="brand-dot"></div>
                    <span class="brand-text">CheeseBall</span>
                </div>
                <h1>{{ headline }}</h1>
                <p>{{ preheader }}</p>
            </div>

            <div class="body">
                {% block content %}{% endblock %}
            </div>

            <div class="notice">
                <p>Never share this code with anyone. CheeseBall support will never ask for it.</p>
            </div>

            <div class="footer">
                <div class="divider"></div>
                <p><strong>CheeseBall</strong>&nbsp;&nbsp;{{ help_text }}</p>
            </div>

        </div>
    </div>
</body>
</html>
