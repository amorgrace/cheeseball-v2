<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{{ headline }}</title>
    <style>
        :root {
            color-scheme: light !important;
            supported-color-schemes: light !important;
        }
        html, body {
            background-color: #FFFFFF !important;
            background: #FFFFFF !important;
            margin: 0 !important;
            padding: 0 !important;
            height: 100% !important;
            width: 100% !important;
            color-scheme: light !important;
        }
        * {
            -ms-text-size-adjust: 100%;
            -webkit-text-size-adjust: 100%;
        }
        div[style*="margin: 16px 0"] {
            margin: 0 !important;
        }
        table, td {
            mso-table-lspace: 0pt !important;
            mso-table-rspace: 0pt !important;
        }
        table {
            border-spacing: 0 !important;
            border-collapse: collapse !important;
            table-layout: fixed !important;
            margin: 0 auto !important;
        }
        /* Strict Dark Mode Overrides for Mobile Apps */
        @media (prefers-color-scheme: dark) {
            body, table, td, div, p, a, span {
                background-color: #FFFFFF !important;
                background: #FFFFFF !important;
                color: #1259D9 !important;
            }
            .hero-td {
                background: #1A6FFF !important;
                background-color: #1A6FFF !important;
                color: #FFFFFF !important;
            }
            .hero-td h1, .hero-td p, .hero-td span {
                color: #FFFFFF !important;
            }
            .otp-box {
                background-color: #EEF3FF !important;
                border: 1px solid #C2D6FF !important;
            }
            .otp-code-val {
                background-color: #FFFFFF !important;
                color: #1A6FFF !important;
                border: 1.5px solid #C2D6FF !important;
            }
            .blue-text {
                color: #1A6FFF !important;
            }
        }
        /* Gmail & Samsung Mail Fixes */
        [data-ogsc] body, [data-ogsc] table, [data-ogsc] td { background-color: #FFFFFF !important; }
        [data-ogsb] body, [data-ogsb] table, [data-ogsb] td { background-color: #FFFFFF !important; }
        [data-ogsc] .hero-td { background-color: #1A6FFF !important; }
        [data-ogsc] .otp-code-val { background-color: #FFFFFF !important; color: #1A6FFF !important; }
    </style>
</head>
<body bgcolor="#FFFFFF" style="background-color: #FFFFFF !important; background: #FFFFFF !important; margin: 0; padding: 0; width: 100%; -webkit-font-smoothing: antialiased;">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0;">{{ preheader }}</div>

    <!-- Outer Wrapper Table -->
    <table border="0" cellpadding="0" cellspacing="0" width="100%" bgcolor="#FFFFFF" style="background-color: #FFFFFF !important; background: #FFFFFF !important; width: 100%; margin: 0; padding: 20px 0;">
        <tr>
            <td align="center" bgcolor="#FFFFFF" style="background-color: #FFFFFF !important; background: #FFFFFF !important; padding: 10px;">
                
                <!-- Main Card Table -->
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 540px; background-color: #FFFFFF !important; border: 1px solid #C2D6FF; border-radius: 20px; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif;">
                    
                    <!-- Hero Header (Primary Blue) -->
                    <tr>
                        <td class="hero-td" bgcolor="#1A6FFF" style="background-color: #1A6FFF !important; background: linear-gradient(160deg, #1A6FFF 0%, #1259D9 100%) !important; padding: 32px 32px 28px; color: #FFFFFF !important; text-align: left;">
                            <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #FFFFFF !important; opacity: 0.75; margin-bottom: 16px;">
                                CHEESEBALL &bull; SECURE MAIL
                            </div>
                            <h1 style="font-size: 24px; font-weight: 700; color: #FFFFFF !important; margin: 0; line-height: 1.2;">
                                {{ headline }}
                            </h1>
                        </td>
                    </tr>

                    <!-- Body Content Area -->
                    <tr>
                        <td bgcolor="#FFFFFF" style="background-color: #FFFFFF !important; padding: 32px; color: #1259D9 !important; text-align: left; font-size: 15px; line-height: 1.6;">
                            {% block content %}
                            {% endblock %}
                        </td>
                    </tr>

                    <!-- Footer Area -->
                    <tr>
                        <td bgcolor="#FFFFFF" style="background-color: #FFFFFF !important; padding: 0 32px 28px; text-align: left; font-size: 12px; color: #1259D9 !important; border-top: 1px solid #EEF3FF;">
                            <p style="margin: 16px 0 0; color: #1259D9 !important;">
                                <strong style="color: #1A6FFF !important;">CheeseBall</strong> &nbsp;&bull;&nbsp; {{ help_text }}
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
</body>
</html>
